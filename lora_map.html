<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        #search {
            position: absolute;
            top: 10px;
            left: 60px;
            z-index: 1000;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
        }

        .center {
            position: absolute;
            bottom: 50px;
            right: 10px;
            z-index: 1000;
            background-color: white;
            padding: 2px;
            border-radius: 50%;
            height: 50px;
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .route-btn {
            position: absolute;
            bottom: 110px;
            right: 10px;
            z-index: 1000;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .form-el input {
            width: calc(100% - 22px);
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-el label {
            margin: 5px 0;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
        }

        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-footer button.cancel {
            background-color: #ccc;
        }

        .modal-footer button.submit {
            background-color: #4CAF50;
            color: white;
        }

        .suggestions {
            position: absolute;
            left: 60px;
            top: 50px;
            z-index: 1001;
            border: 1px solid #ccc;
            border-top: none;
            background-color: white;
            width: 300px;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .suggestions ul li {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
        }

        .suggestions ul li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div id="map">
        <form id="form">
            <input type="search" placeholder="Enter Location" id="search" name="location">
            <div id="suggestions" class="suggestions" style="display: none;">
                <ul></ul>
            </div>
        </form>
        <button id="center" class="center">
            <i class="fa fa-compass"></i>
        </button>
        <button id="route-btn" class="route-btn">Get Route</button>
    </div>

    <div id="route-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form id="route-form" class="form-el">
                <label for="start">Starting Point:</label>
                <input type="text" id="start" name="start" placeholder="Enter starting location">
                <div id="start-suggestions" class="suggestions" style="display: none;">
                    <ul></ul>
                </div>

                <label for="end">Destination:</label>
                <input type="text" id="end" name="end" placeholder="Enter destination">
                <div id="end-suggestions" class="suggestions" style="display: none;">
                    <ul></ul>
                </div>

                <div class="modal-footer">
                    <button type="button" class="cancel">Cancel</button>
                    <button type="submit" class="submit">Get Route</button>
                </div>
            </form>
        </div>
    </div>

    <div id="markerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form class="form-el" id="description-form">
                <label for="title">Title:</label>
                <input type="text" id="title" placeholder="Enter marker comment">
                <label for="des">Description:</label>
                <input type="text" id="des" placeholder="Enter marker comment">
                <div class="modal-footer">
                    <button type="button" class="cancel">Cancel</button>
                    <button type="submit" class="submit">Add Description</button>
                    
                </div>
            </form>
        </div>
    </div>

    <script>
        const mapEl = document.getElementById("map");
        const formEl = document.getElementById("form");
        const searchEl = document.getElementById("search");
        const suggestionsEl = document.getElementById("suggestions");
        const routeBtnEl = document.getElementById("route-btn");
        const routeModalEl = document.getElementById("route-modal");
        const markerModalEl = document.getElementById("markerModal");
        const descriptionFormEl = document.getElementById("description-form");
        const descriptionInputEl = document.getElementById("des");
        const titleInputEl = document.getElementById("title");
        const closeEls = document.querySelectorAll(".close");
        const cancelBtnsEl = document.querySelectorAll(".cancel");
        const submitBtnsEl = document.querySelectorAll(".submit");
        const startEl = document.getElementById("start");
        const startSuggestionsEl = document.getElementById("start-suggestions");
        const endEl = document.getElementById("end");
        const endSuggestionsEl = document.getElementById("end-suggestions");
        const iconUrl = 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png';
        const centerEl = document.getElementById("center");
        const routeFormEl = document.getElementById("route-form")

        let map = L.map("map").setView([7.866, -1.604], 7);
        map.locate({setView: true, maxZoom: 16});

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let latlngToPlaceMarker;
        let routeLayer;
        let droppedImageLatLng;

        const fetchCoordinates = async (location) => {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(location)}&format=json`);
            const data = await response.json();
            return data.length > 0 ? [parseFloat(data[0].lat), parseFloat(data[0].lon)] : null;
        };

        const fetchRoute = async (start, end) => {
            const startCoords = await fetchCoordinates(start);
            const endCoords = await fetchCoordinates(end);

            if (!startCoords || !endCoords) {
                alert('Invalid locations provided.');
                return;
            }

            const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}?overview=full&geometries=geojson`);
            const data = await response.json();

            if (data.routes && data.routes.length > 0) {
                const route = data.routes[0];
                if (routeLayer) {
                    map.removeLayer(routeLayer);
                }
                routeLayer = L.geoJSON(route.geometry).addTo(map);
                map.fitBounds(routeLayer.getBounds());
            } else {
                alert('Route not found.');
            }
        };

        const showSuggestions = (element, suggestions) => {
            const ul = element.querySelector('ul');
            ul.innerHTML = '';
            suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                li.textContent = suggestion.display_name;
                li.addEventListener('click', () => {
                    element.style.display = 'none';
                    const input = element.previousElementSibling;
                    input.value = suggestion.display_name;
                    const coords = [parseFloat(suggestion.lat), parseFloat(suggestion.lon)];
                    map.setView(coords, 13);
                    const marker = L.marker(coords, {
                        icon: L.icon({
                            iconUrl: iconUrl,
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34]
                        })
                    }).addTo(map).bindPopup(`Latitude: ${coords[0]}<br>Longitude: ${coords[1]}`).openPopup();

                    marker.on('drag', (event) => {
                        const newLatLng = event.target.getLatLng();
                        marker.setPopupContent(`Latitude: ${newLatLng.lat}<br>Longitude: ${newLatLng.lng}`).openPopup();
                    });

                    marker.on("contextmenu", (event) => {
                        map.removeLayer(marker);
                    });
                });
                ul.appendChild(li);
            });
            element.style.display = 'block';
        };

        const fetchSuggestions = async (query, callback) => {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json`);
            const data = await response.json();
            callback(data);
        };

        mapEl.addEventListener('dragover', function(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy';
            console.log('Drag over event triggered', event);
        });

        mapEl.addEventListener('drop', function(event) {
            event.preventDefault();
            console.log('Drop event triggered', event);

            var dataTransfer = event.dataTransfer;
            var base64Data = dataTransfer.getData('text/plain');
            console.log('Data received:', base64Data);

            if (base64Data) {
                droppedImageLatLng = map.mouseEventToLatLng(event);
                var imageURL = 'data:image/png;base64,' + base64Data

                showMarkerModal(imageURL)
              
            } else {
                console.log('No base64 data found');
            }
        });

        const showMarkerModal = (imageURL) => {
            markerModalEl.style.display = 'flex';
            descriptionFormEl.onsubmit = function (e) {
                e.preventDefault();
                const description = descriptionInputEl.value.trim();
                const title = titleInputEl.value.trim();
                if (description && title) {
                    addMarker(droppedImageLatLng, imageURL, description, title);
                    markerModalEl.style.display = 'none';
                    descriptionInputEl.value = '';
                } else {
                    alert("cannot be empty");
                }
            };
        };

        const addMarker = (latlng, imageURL, description, title) => {
            const customIcon = L.icon({
                iconUrl: imageURL,
                iconSize: [40, 40],
                iconAnchor: [20, 40], 
                popupAnchor: [1, -34]
            });

            const marker = L.marker(latlng, {
                draggable: true,
                icon: customIcon
            }).addTo(map).bindPopup(`
            <strong>Title:</strong> ${title}<br>
            <strong>Description:</strong> ${description}<br>
            Latitude: ${latlng.lat}<br>
            Longitude: ${latlng.lng}`).openPopup();

            marker.on('drag', (event) => {
                const newLatLng = event.target.getLatLng();
                marker.setPopupContent(`
                <strong>Title:</strong> ${title}<br>
                <strong>Description:</strong> ${description}<br>
                Latitude: ${newLatLng.lat}<br>
                Longitude: ${newLatLng.lng}`).openPopup();
            });

            marker.on("contextmenu", () => {
                map.removeLayer(marker);
            });
        };

        mapEl.addEventListener("keydown", (event) => {
            if (event.key === "m" && latlngToPlaceMarker) {
                const marker = L.marker(latlngToPlaceMarker, {
                    draggable: true,
                }).addTo(map).bindPopup(`Latitude: ${latlngToPlaceMarker.lat}<br>Longitude: ${latlngToPlaceMarker.lng}`).openPopup();

                marker.on('drag', (event) => {
                    const newLatLng = event.target.getLatLng();
                    marker.setPopupContent(`Latitude: ${newLatLng.lat}<br>Longitude: ${newLatLng.lng}`).openPopup();
                });

                marker.on("contextmenu", (event) => {
                    map.removeLayer(marker);
                });

                latlngToPlaceMarker = null;
            }

            if (event.key === "Escape") {
                latlngToPlaceMarker = null;
            }

            if (event.key === "r") {
                start = latlngToPlaceMarker;
                console.log(start);
            }
        });

        map.on("click", (event) => {
            latlngToPlaceMarker = event.latlng;
        });

        searchEl.addEventListener("input", async (event) => {
            const query = event.target.value;
            if (query.length > 2) {
                fetchSuggestions(query, (suggestions) => {
                    showSuggestions(suggestionsEl, suggestions);
                });
            } else {
                suggestionsEl.style.display = 'none';
            }
        });

        startEl.addEventListener("input", async (event) => {
            const query = event.target.value;
            if (query.length > 2) {
                fetchSuggestions(query, (suggestions) => {
                    showSuggestions(startSuggestionsEl, suggestions);
                });
            } else {
                startSuggestionsEl.style.display = 'none';
            }
        });

        endEl.addEventListener("input", async (event) => {
            const query = event.target.value;
            if (query.length > 2) {
                fetchSuggestions(query, (suggestions) => {
                    showSuggestions(endSuggestionsEl, suggestions);
                });
            } else {
                endSuggestionsEl.style.display = 'none';
            }
        });

        centerEl.addEventListener("click", (event) => {
            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                map.setView([latitude, longitude], 15);

                L.circle([latitude, longitude], {radius: 1000}).addTo(map);
                const marker = L.marker([latitude, longitude]).addTo(map)
                    .bindPopup(`Latitude: ${latitude}<br>Longitude: ${longitude}`).openPopup();
            });
        });

        routeBtnEl.addEventListener("click", () => {
            routeModalEl.style.display = "flex";
        });

        closeEls.forEach((el) => {
            el.addEventListener("click", () => {
                routeModalEl.style.display = "none";
                markerModalEl.style.display = "none";
            });
        });

        cancelBtnsEl.forEach((el) => {
            el.addEventListener("click", () => {
                routeModalEl.style.display = "none";
                markerModalEl.style.display = "none";
            });
        });

        routeFormEl.addEventListener("submit", async (event) => {
            event.preventDefault();
            const startLocation = routeFormEl.elements.start.value;
            const endLocation = routeFormEl.elements.end.value;

            if (!startLocation || !endLocation) {
                alert('Please provide both starting point and destination.');
                return;
            }

            await fetchRoute(startLocation, endLocation);

            routeModalEl.style.display = "none";
        });

        formEl.addEventListener("submit", (e)=>{
            e.preventDefault()
        })

        window.addEventListener("click", (event) => {
            if (event.target === routeModalEl || event.target === markerModalEl) {
                routeModalEl.style.display = "none";
                markerModalEl.style.display = "none";
            }
        });
    </script>
</body>
</html>
